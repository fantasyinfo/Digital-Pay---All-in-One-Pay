name: CICD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up environment variables
        run: echo "${{ secrets.PROD_MAIN_B }}" > .env

      - name: Set up QEMU and Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GHCR_DOCKERHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/digi1pay:${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 -t $IMAGE_TAG .
          docker push $IMAGE_TAG

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GHCR_DOCKERHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image from GitHub Container Registry
        run: docker pull ghcr.io/${{ github.repository_owner }}/digi1pay:${{ github.sha }}

      - name: Delete old container
        run: docker rm -f nodejs-app-container || true

      - name: Run docker container
        run: docker run -d -p 8000:8000 --name nodejs-app-container ghcr.io/${{ github.repository_owner }}/digi1pay:${{ github.sha }}
